<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07101f">
<title>REI CHRONO</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eaf7ff;touch-action:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#142744 0%,#070d1b 58%,#03060d 100%)}
canvas{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh);max-width:100%;max-height:100%;image-rendering:pixelated;border:1px solid #234765;box-shadow:0 0 32px #00b9ff25}
#hud{position:absolute;top: max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(94vw,900px);display:flex;gap:7px;justify-content:space-between;pointer-events:none}
.panel{background:#071426e8;border:1px solid #267ba2;border-radius:7px;padding:5px 9px;min-width:95px;box-shadow:0 0 12px #00bfff18}
.panel b{display:block;font-size:10px;letter-spacing:1.3px;color:#62dfff}
.panel span{font-size:13px;font-weight:700}
#message{position:absolute;left:50%;top:20%;transform:translateX(-50%);padding:9px 14px;background:#071426ed;border:1px solid #4adfff;border-radius:8px;font-weight:700;text-align:center;opacity:0;transition:opacity .15s;pointer-events:none;max-width:90%;white-space:normal}
#controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none}
.cluster{display:flex;gap:9px;pointer-events:auto}
.ctrl{width:58px;height:58px;border-radius:15px;border:1px solid #4ccfff99;background:#09203ad9;color:#eafaff;font-size:23px;font-weight:800;box-shadow:0 0 15px #00bfff24;touch-action:none}
.ctrl:active{background:#17618a}
.ctrl.small{font-size:14px;width:65px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#030916ed,#091b32e8);text-align:center;padding:24px}
#overlay .box{max-width:650px}
#overlay h1{font-size:clamp(36px,8vw,76px);letter-spacing:.12em;margin:0;color:#eafaff;text-shadow:0 0 12px #00c8ff,0 0 35px #007aff}
#overlay .sub{letter-spacing:.32em;color:#6ce4ff;margin:10px 0 25px;font-size:clamp(11px,2vw,15px)}
#overlay p{color:#c4d9e9;line-height:1.8}
#start{margin-top:20px;padding:13px 34px;border:1px solid #5be2ff;border-radius:7px;background:#07385a;color:white;font-size:16px;font-weight:800;letter-spacing:.15em;box-shadow:0 0 22px #00bfff45}
#start:active{background:#0b628c}
.hidden{display:none!important}
@media(min-width:800px){#controls{opacity:.8}.ctrl{width:64px;height:64px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="960" height="540" aria-label="REI CHRONO game"></canvas>
<div id="hud">
 <div class="panel"><b>PLAYER HP</b><span id="hp">♥ ♥ ♥</span></div>
 <div class="panel"><b>DATA CHIP</b><span id="chips">0 / 6</span></div>
 <div class="panel"><b>NEO WATCH</b><span id="watch">LOCKED</span></div>
 <div class="panel"><b>AREA</b><span id="area">NEON CITY</span></div>
</div>
<div id="message"></div>
<div id="controls">
 <div class="cluster"><button class="ctrl" id="left" aria-label="左">◀</button><button class="ctrl" id="right" aria-label="右">▶</button></div>
 <div class="cluster"><button class="ctrl small" id="use">USE</button><button class="ctrl" id="jump">▲</button><button class="ctrl small" id="dash">DASH</button></div>
</div>
<div id="overlay">
 <div class="box">
  <h1>REI CHRONO</h1>
  <div class="sub">A CITY’S SECRET</div>
  <p>2D EXPLORATION ADVENTURE<br>ネオンに包まれた都市の謎を解き明かせ。</p>
  <p style="font-size:12px;color:#8eafc4">移動：◀ ▶　ジャンプ：▲　端末・ギミック：USE　回避：DASH</p>
  <button id="start">START GAME</button>
 </div>
</div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=960,H=540, FLOOR=430;
const $=id=>document.getElementById(id);
let mode='title',stage=0,camera=0,frame=0,toastTimer=0;
let hp=3,chips=0,watch=false,terminalOn=false,echoUntil=0,endingFrame=0;
let keys={left:false,right:false,jump:false,dash:false};
let player={x:70,y:370,w:27,h:55,vx:0,vy:0,ground:false,face:1,dashT:0,dashCooldown:0,inv:0,lastSafe:70};
let platforms=[],vanish=[],chipsList=[],lasers=[],terminal=null,wall=null,beacon=null,portal=null;
const maps=[
 {name:'NEON CITY',length:1900,floors:[[0,430,430],[490,430,350],[900,430,370],[1320,430,580]],
  vanish:[[440,345,70],[780,305,75],[1200,320,75]],chipX:[250,620,1040],
  terminalX:385,wallX:560,laser:[],beacon:null,portalX:1770},
 {name:'NEON LAB',length:2050,floors:[[0,430,330],[390,430,300],[760,430,330],[1160,430,300],[1530,430,520]],
  vanish:[[330,345,60],[690,330,70],[1090,335,70],[1460,330,70]],chipX:[210,590,950],
  terminalX:810,wallX:1090,laser:[{x:760,y:120,h:310,period:420,off:210}],beacon:1370,portalX:1950}
];
function say(s){$('message').textContent=s;$('message').style.opacity=1;toastTimer=130}
function buildStage(n){
 stage=n;let m=maps[n];camera=0;terminalOn=false;echoUntil=0;
 platforms=m.floors.map(a=>({x:a[0],y:a[1],w:a[2],h:18,kind:'floor',active:true}));
 vanish=m.vanish.map(a=>({x:a[0],y:a[1],w:a[2],h:14,active:true,state:'ready',timer:0}));
 chipsList=m.chipX.map((x,i)=>({x,y:365-(i%2)*65,taken:false}));
 terminal={x:m.terminalX,y:374,w:35,h:56};
 wall={x:m.wallX,y:0,w:30,h:430};
 lasers=m.laser.map(a=>({...a}));
 beacon=m.beacon===null?null:{x:m.beacon,y:370};
 portal={x:m.portalX,y:345,w:40,h:85};
 player.x= n===0?70:70;player.y=365;player.vx=0;player.vy=0;player.lastSafe=70;player.ground=false;player.dashT=0;player.dashCooldown=0;player.inv=50;
 $('area').textContent=m.name;
 updateHud();
}
function updateHud(){
 $('hp').textContent='♥ '.repeat(hp).trim()||'—';
 $('chips').textContent=chips+' / 6';
 $('watch').textContent=watch?'ONLINE':'LOCKED';
}
function resetAll(){hp=3;chips=0;watch=false;buildStage(0);mode='play';$('overlay').classList.add('hidden');say('NEON CITY — 調査を開始');}
function near(a,b,d){return Math.abs((a.x+a.w/2)-(b.x+b.w/2))<d && Math.abs((a.y+a.h/2)-(b.y+b.h/2))<90}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hurt(){
 if(player.inv>0)return;
 hp--;player.inv=95;player.vx=0;player.vy=0;player.x=player.lastSafe;player.y=365;
 updateHud();say('HAZARD — 安全地点に戻った');
 if(hp<=0){hp=3;updateHud();say('RETRY — エリアの最初から再開');buildStage(stage);}
}
function useAction(){
 if(mode!=='play')return;
 if(near(player,terminal,90)){
  if(!terminalOn){terminalOn=true;wall=null;say('TERMINAL ONLINE — 前方の隔壁が解除された');}
  else say('端末はすでに起動している');
  return;
 }
 if(beacon&&near(player,{x:beacon.x,y:beacon.y,w:30,h:60},95)){
  echoUntil=frame+360;say('NEON ECHO — 光の足場が出現！');return;
 }
}
function update(){
 if(mode!=='play')return;
 frame++;
 if(toastTimer>0&&--toastTimer===0)$('message').style.opacity=0;
 if(player.inv>0)player.inv--;
 if(player.dashCooldown>0)player.dashCooldown--;
 if(keys.left){player.vx-=.55;player.face=-1}
 if(keys.right){player.vx+=.55;player.face=1}
 player.vx*=.82;player.vx=Math.max(-4.2,Math.min(4.2,player.vx));
 if(keys.jump&&player.ground){player.vy=-11.5;player.ground=false}
 if(keys.dash&&player.dashT===0&&player.dashCooldown===0){player.dashT=12;player.dashCooldown=90;player.vx=player.face*9;player.vy=Math.min(player.vy,0)}
 if(player.dashT>0){player.dashT--;player.vx=player.face*8}
 player.vy+=.52;player.vy=Math.min(player.vy,12);
 let oldY=player.y;player.x+=player.vx;
 player.x=Math.max(0,Math.min(maps[stage].length-player.w,player.x));
 // Full-height sealed wall: only the terminal can remove it.
 if(wall&&rectHit(player,wall)){
  if(player.x+player.w/2<wall.x+wall.w/2)player.x=wall.x-player.w;
  else player.x=wall.x+wall.w;
  player.vx=0;
 }
 player.y+=player.vy;player.ground=false;
 const all=[...platforms.filter(p=>p.active),...vanish.filter(p=>p.active)];
 for(const p of all){
  if(player.vy>=0&&oldY+player.h<=p.y+8&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){
   player.y=p.y-player.h;player.vy=0;player.ground=true;
   if(p.kind==='floor')player.lastSafe=player.x;
   else if(p.state==='ready'){p.state='warning';p.timer=48}
  }
 }
 // Vanishing platforms flash first, disappear, then return.
 for(const p of vanish){
  if(p.state==='warning'&&--p.timer<=0){p.state='gone';p.active=false;p.timer=145}
  else if(p.state==='gone'&&--p.timer<=0){p.state='ready';p.active=true}
 }
 // ECHO bridge is temporary.
 if(echoUntil>frame){
  if(!platforms.some(p=>p.kind==='echo'))platforms.push({x:1400,y:350,w:75,h:14,kind:'echo',active:true},{x:1500,y:315,w:75,h:14,kind:'echo',active:true});
 }else platforms=platforms.filter(p=>p.kind!=='echo');
 if(player.y>H+40){hurt()}
 // Laser timing: inactive interval is safe.
 for(const l of lasers){
  const on=(frame%l.period)>=l.off;
  if(on&&rectHit(player,{x:l.x-5,y:l.y,w:10,h:l.h}))hurt();
 }
 // Collect data chips.
 for(const c of chipsList)if(!c.taken&&rectHit(player,{x:c.x,y:c.y,w:18,h:18})){c.taken=true;chips++;updateHud();say('DATA CHIP +1')}
 // Stage exit.
 if(rectHit(player,portal)){
  if(stage===0){watch=true;updateHud();say('NEO WATCH ONLINE — NEXT AREA');buildStage(1);player.inv=100}
  else{mode='ending';endingFrame=0}
 }
 if(player.ground&&player.y<390)player.lastSafe=player.x;
 camera=Math.max(0,Math.min(maps[stage].length-W,player.x-W*.36));
}
function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07152c');g.addColorStop(1,'#10142b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant skyline
 for(let i=0;i<34;i++){
  let x=((i*103-camera*.22)%1200+1200)%1200-100;
  let h=80+(i*47%160);ctx.fillStyle=i%2?'#102b49':'#0b203b';ctx.fillRect(x,430-h,55,h);
  ctx.fillStyle='#1b7090';for(let y=450-h;y<420;y+=20)for(let xx=x+9;xx<x+48;xx+=17)if((i+Math.floor(y/20))%3)ctx.fillRect(xx,y,5,7);
 }
 for(let i=0;i<9;i++){let x=((i*151-camera*.5)%1100+1100)%1100-50;ctx.fillStyle='#00c8ff22';ctx.fillRect(x,80,2,300)}
}
function draw(){
 ctx.clearRect(0,0,W,H);drawBackground();ctx.save();ctx.translate(-camera,0);
 // floor/platforms
 for(const p of platforms){if(!p.active)continue;ctx.fillStyle=p.kind==='echo'?'#9c62ff':'#173a56';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle=p.kind==='echo'?'#e0baff':'#32cfff';ctx.fillRect(p.x,p.y,p.w,3)}
 for(const p of vanish){
  if(p.active){ctx.fillStyle=p.state==='warning'&&Math.floor(frame/5)%2?'#ffbd62':'#8e62bd';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#e8c8ff';ctx.fillRect(p.x,p.y,p.w,3)}
 }
 // terminal and wall
 if(terminal){ctx.fillStyle='#092d42';ctx.fillRect(terminal.x,terminal.y,terminal.w,terminal.h);ctx.fillStyle=terminalOn?'#58ffbd':'#00cfff';ctx.fillRect(terminal.x+8,terminal.y+9,19,14);ctx.fillStyle='#a9f4ff';ctx.fillRect(terminal.x+15,terminal.y+28,5,19)}
 if(wall){ctx.fillStyle='#263e60';ctx.fillRect(wall.x,wall.y,wall.w,wall.h);ctx.fillStyle='#53dfff';for(let y=15;y<wall.h;y+=32)ctx.fillRect(wall.x+5,y,20,3)}
 // laser
 for(const l of lasers){let on=(frame%l.period)>=l.off;ctx.fillStyle=on?'#ff344f':'#ff344f22';ctx.fillRect(l.x-3,l.y,6,l.h);if(on){ctx.fillStyle='#ff8b9b';ctx.fillRect(l.x-1,l.y,2,l.h)}}
 // ECHO beacon
 if(beacon){ctx.fillStyle='#8f5cff';ctx.beginPath();ctx.arc(beacon.x,beacon.y,14+Math.sin(frame/8)*3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f1d8ff';ctx.fillRect(beacon.x-3,beacon.y-23,6,46)}
 // chips
 for(const c of chipsList)if(!c.taken){ctx.save();ctx.translate(c.x+8,c.y+8);ctx.rotate(Math.PI/4);ctx.fillStyle='#4df5ff';ctx.fillRect(-7,-7,14,14);ctx.restore()}
 // portal
 ctx.fillStyle='#1a8dff55';ctx.fillRect(portal.x,portal.y,portal.w,portal.h);ctx.strokeStyle='#54eaff';ctx.lineWidth=4;ctx.strokeRect(portal.x,portal.y,portal.w,portal.h);
 // player human pixel sprite
 if(!(player.inv>0&&Math.floor(frame/5)%2)){
  let x=player.x,y=player.y;
  // legs and shoes
  ctx.fillStyle='#152c55';ctx.fillRect(x+5,y+39,7,13);ctx.fillRect(x+16,y+39,7,13);
  ctx.fillStyle='#07101d';ctx.fillRect(x+2,y+50,12,5);ctx.fillRect(x+14,y+50,13,5);
  // jacket/body
  ctx.fillStyle='#1478b8';ctx.fillRect(x+3,y+20,22,21);ctx.fillStyle='#48d5ff';ctx.fillRect(x+12,y+21,4,17);
  ctx.fillStyle='#0b3c73';ctx.fillRect(x,y+23,5,15);ctx.fillRect(x+23,y+23,5,15);
  // neck and face
  ctx.fillStyle='#e6b99e';ctx.fillRect(x+10,y+16,9,7);ctx.fillRect(x+7,y+7,16,13);
  ctx.fillStyle='#f2f5ff';ctx.fillRect(x+5,y+2,19,9);ctx.fillRect(x+3,y+7,7,7);ctx.fillRect(x+18,y+5,8,6);
  ctx.fillStyle='#18314c';ctx.fillRect(player.face===1?18:8,y+12,3,2);
  ctx.fillStyle='#8eeaff';ctx.fillRect(x+8,y+4,10,3);
 }
 ctx.restore();
 // stage hint
 ctx.fillStyle='#b8eaff';ctx.font='13px system-ui';ctx.fillText(stage===0?'FIND THE TERMINAL':'ACTIVATE NEON ECHO TO REACH THE EXIT',20,500);
 if(mode==='ending')drawEnding();
}
function drawEnding(){
 endingFrame++;ctx.fillStyle='#020817dd';ctx.fillRect(0,0,W,H);
 let r=25+endingFrame*5;let grad=ctx.createRadialGradient(W/2,H/2,4,W/2,H/2,r);grad.addColorStop(0,'#d9fbff');grad.addColorStop(.25,'#31cfff');grad.addColorStop(1,'#07142b00');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';ctx.shadowColor='#20cfff';ctx.shadowBlur=20;ctx.fillStyle='#eafaff';ctx.font='bold 44px system-ui';ctx.fillText('MISSION COMPLETE',W/2,220);
 ctx.font='bold 26px system-ui';ctx.fillText('REI CHRONO',W/2,270);ctx.shadowBlur=0;ctx.fillStyle='#9bd9ed';ctx.font='15px system-ui';ctx.fillText('THE CITY’S SECRET IS STILL WAITING…',W/2,315);
 if(endingFrame>170){ctx.font='bold 18px system-ui';ctx.fillStyle='#fff';ctx.fillText('THANK YOU FOR PLAYING',W/2,380);ctx.fillText('RESTART TO PLAY AGAIN',W/2,420)}
 ctx.textAlign='left';
}
function loop(){update();draw();requestAnimationFrame(loop)}
function bindHold(id,key){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{keys[key]=false}))}
bindHold('left','left');bindHold('right','right');bindHold('jump','jump');bindHold('dash','dash');
$('use').addEventListener('pointerdown',e=>{e.preventDefault();useAction()});
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' ','Shift'].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
 if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.jump=true;
 if(e.key==='Shift'||e.key==='x')keys.dash=true;
 if(e.key==='e'||e.key==='Enter')useAction();
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
 if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.jump=false;
 if(e.key==='Shift'||e.key==='x')keys.dash=false;
});
$('start').addEventListener('click',resetAll);
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')&&mode==='title')resetAll()});
window.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){resetAll()}});
buildStage(0);loop();
})();
</script>
</body>
</html>
